<!DOCTYPE html>
<html lang="sr-Latn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prijava — Upitko CRM za srpske firme</title>
  <meta name="description" content="Prijavite se u Upitko radni prostor vaše firme i upravljajte svim prodajnim upitima na jednom mestu." />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="sr_RS" />
  <meta property="og:title" content="Prijava — Upitko CRM" />
  <meta property="og:image" content="/og-image.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />
  <!-- Supabase JS SDK v2 -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <style>
    :root {
      --bg:#04060f; --bg-2:#060a18; --ink:#f3f6ff; --muted:#9aa6c4; --muted-2:#6b7796;
      --line:rgba(150,175,230,.14); --line-strong:rgba(150,175,230,.25);
      --accent:#5df0a8; --accent-2:#2fd38a; --accent-ink:#032018;
      --glass:rgba(12,18,38,.72); --radius:18px;
      --font:'Inter',-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    }
    * { box-sizing:border-box; margin:0; padding:0; }
    body {
      font-family:var(--font); color:var(--ink); background:var(--bg);
      min-height:100vh; display:flex; flex-direction:column;
      -webkit-font-smoothing:antialiased;
      background:radial-gradient(100% 70% at 50% -10%, rgba(20,40,90,.32) 0%, rgba(4,6,15,1) 85%);
      position:relative; overflow-x:hidden;
    }
    .nav {
      max-width:1180px; width:100%; margin:0 auto; padding:24px;
      display:flex; justify-content:space-between; align-items:center;
    }
    .brand {
      display:inline-flex; align-items:center; gap:9px; font-weight:800; font-size:20px;
      letter-spacing:.16em; text-transform:uppercase; color:var(--ink); text-decoration:none;
    }
    .brand-mark { color:var(--accent); font-size:15px; }
    .auth-container {
      flex:1; display:flex; align-items:center; justify-content:center;
      padding:32px 24px;
    }
    .auth-card {
      width:100%; max-width:440px; background:var(--glass);
      border:1px solid var(--line-strong); border-radius:var(--radius);
      padding:40px 36px; backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
      box-shadow:0 30px 80px -20px rgba(0,0,0,.8), inset 0 1px 0 rgba(255,255,255,.1);
      position:relative;
    }
    .auth-card::before {
      content:''; position:absolute; top:-1px; left:30px; right:30px; height:2px;
      background:linear-gradient(90deg, transparent, var(--accent), transparent);
    }
    .auth-head { text-align:center; margin-bottom:28px; }
    .auth-head h1 { font-size:26px; font-weight:800; letter-spacing:-.02em; margin-bottom:8px; }
    .auth-head p { font-size:14px; color:var(--muted); line-height:1.5; }
    .form-group { margin-bottom:18px; display:grid; gap:7px; }
    .form-group label { font-size:13px; font-weight:600; color:var(--ink); }
    .form-control {
      width:100%; padding:12px 14px; border-radius:12px;
      border:1px solid var(--line-strong); background:rgba(4,6,15,.75);
      color:var(--ink); font-size:14.5px; font-family:inherit; outline:none;
      transition:border-color .2s, box-shadow .2s;
    }
    .form-control:focus {
      border-color:var(--accent); box-shadow:0 0 0 3px rgba(93,240,168,.18);
    }
    .btn-submit {
      width:100%; padding:13px; border-radius:999px; border:none;
      background:linear-gradient(180deg, var(--accent), var(--accent-2));
      color:var(--accent-ink); font-weight:700; font-size:15px; font-family:inherit;
      cursor:pointer; margin-top:8px; transition:transform .18s, box-shadow .2s;
      display:flex; align-items:center; justify-content:center; gap:8px;
    }
    .btn-submit:hover { transform:translateY(-2px); box-shadow:0 12px 30px -6px rgba(93,240,168,.6); }
    .btn-submit:disabled { opacity:.6; cursor:not-allowed; transform:none; }
    .auth-foot {
      margin-top:24px; text-align:center; font-size:13.5px; color:var(--muted);
    }
    .auth-foot a { color:var(--accent); font-weight:600; text-decoration:none; }
    .auth-foot a:hover { text-decoration:underline; }
    .alert-box {
      padding:12px 14px; border-radius:10px; font-size:13.5px; margin-bottom:18px; display:none;
    }
    .alert-error { background:rgba(255,80,80,.12); border:1px solid rgba(255,80,80,.3); color:#ff9090; }
    .alert-info { background:rgba(93,240,168,.1); border:1px solid rgba(93,240,168,.3); color:var(--accent); }
    .config-trigger {
      font-size:12px; color:var(--muted-2); text-align:center; margin-top:20px;
      cursor:pointer; text-decoration:underline;
    }
    .config-panel {
      display:none; margin-top:16px; padding:16px; border-radius:12px;
      background:rgba(2,4,10,.8); border:1px dashed var(--line-strong); font-size:12.5px;
    }
  </style>
</head>
<body>
  <header class="nav">
    <a href="index.html" class="brand"><span class="brand-mark">▲</span><span>Upitko</span></a>
    <a href="registracija.html" style="font-size:14px; color:var(--muted); text-decoration:none;">Nemate nalog? <strong style="color:var(--accent);">Registrujte se</strong></a>
  </header>

  <main class="auth-container">
    <div class="auth-card">
      <div class="auth-head">
        <h1>Prijava u radni prostor</h1>
        <p>Unesite pristupne podatke vaše firme za pristup CRM sistemu</p>
      </div>

      <div id="alert" class="alert-box"></div>

      <form id="login-form">
        <div class="form-group">
          <label for="email">Poslovni email</label>
          <input type="email" id="email" required placeholder="marko@firma.rs" class="form-control" autocomplete="email" />
        </div>

        <div class="form-group">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <label for="password">Lozinka</label>
            <a href="#" id="forgot-pass" style="font-size:12px; color:var(--muted); text-decoration:none;">Zaboravili ste?</a>
          </div>
          <input type="password" id="password" required placeholder="••••••••" class="form-control" autocomplete="current-password" />
        </div>

        <button type="submit" id="submit-btn" class="btn-submit">
          <span>Prijavite se</span>
        </button>
      </form>

      <div class="auth-foot">
        Nemate još otvoren nalog za vaš tim?<br>
        <a href="registracija.html">Otvorite besplatan radni prostor &rarr;</a>
      </div>

      <div class="config-trigger" id="config-toggle">⚙️ Povezivanje sopstvenog Supabase projekta</div>
      <div class="config-panel" id="config-panel">
        <div style="font-weight:600; margin-bottom:8px; color:var(--ink);">Supabase API ključevi:</div>
        <div class="form-group" style="margin-bottom:8px;">
          <input type="text" id="sb-url" placeholder="https://xyz.supabase.co" class="form-control" style="font-size:12px; padding:8px 10px;" />
        </div>
        <div class="form-group" style="margin-bottom:12px;">
          <input type="text" id="sb-anon" placeholder="eyJhbGciOiJIUzI1NiIsInR5cCI6Ik..." class="form-control" style="font-size:12px; padding:8px 10px;" />
        </div>
        <button type="button" id="sb-save" class="btn-submit" style="padding:8px; font-size:13px;">Sačuvaj ključeve</button>
      </div>
    </div>
  </main>

  <script>
    const alertBox = document.getElementById('alert');
    const form = document.getElementById('login-form');
    const submitBtn = document.getElementById('submit-btn');

    function showAlert(msg, isError = true) {
      alertBox.textContent = msg;
      alertBox.className = 'alert-box ' + (isError ? 'alert-error' : 'alert-info');
      alertBox.style.display = 'block';
    }

    // Config panel toggle
    const configToggle = document.getElementById('config-toggle');
    const configPanel = document.getElementById('config-panel');
    const sbUrlInput = document.getElementById('sb-url');
    const sbAnonInput = document.getElementById('sb-anon');
    const sbSaveBtn = document.getElementById('sb-save');

    sbUrlInput.value = window.UPITKO_CONFIG.supabaseUrl;
    sbAnonInput.value = window.UPITKO_CONFIG.supabaseAnonKey;

    configToggle.addEventListener('click', () => {
      configPanel.style.display = configPanel.style.display === 'block' ? 'none' : 'block';
    });

    sbSaveBtn.addEventListener('click', () => {
      window.UPITKO_CONFIG.saveConfig(sbUrlInput.value, sbAnonInput.value);
      showAlert('✓ Supabase konfiguracija sačuvana!', false);
      setTimeout(() => { configPanel.style.display = 'none'; }, 1000);
    });

    // Login submit
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!window.UPITKO_CONFIG.isConfigured()) {
        await window.UPITKO_CONFIG.fetchServerConfig();
      }

      const sb = window.getSupabase();
      if (!sb) {
        // Ako Supabase još nije podešen, obavesti korisnika
        configPanel.style.display = 'block';
        showAlert('Molimo unesite Supabase Project URL i Anon Key da biste povezali pravu bazu.', true);
        return;
      }

      submitBtn.disabled = true;
      submitBtn.innerHTML = '<span>Prijavljivanje...</span>';

      try {
        const { data, error } = await sb.auth.signInWithPassword({ email, password });
        if (error) {
          showAlert('Greška pri prijavi: ' + (error.message === 'Invalid login credentials' ? 'Pogrešan email ili lozinka.' : error.message));
          submitBtn.disabled = false;
          submitBtn.innerHTML = '<span>Prijavite se</span>';
          return;
        }

        showAlert('✓ Uspešna prijava! Preusmeravanje...', false);
        setTimeout(() => {
          window.location.href = 'app.html';
        }, 800);
      } catch (err) {
        showAlert('Došlo je do greške: ' + err.message);
        submitBtn.disabled = false;
        submitBtn.innerHTML = '<span>Prijavite se</span>';
      }
    });

    // Ako je već ulogovan, preusmeri na app.html
    window.addEventListener('DOMContentLoaded', async () => {
      const sb = window.getSupabase();
      if (sb) {
        const { data } = await sb.auth.getSession();
        if (data && data.session) {
          window.location.href = 'app.html';
        }
      }
    });
  </script>
</body>
</html>
